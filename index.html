<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>条形码扫码与导出</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.2"></script>
<style>
  body { font-family: sans-serif; text-align: center; padding: 10px; background: #f5f5f5; margin: 0; }
  h1 { font-size: 24px; margin: 10px 0; }
  #videoWrap { position: relative; width: 100%; max-width: 500px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
  video { width: 100%; display: block; }
  .red-line { position: absolute; top: 50%; left: 5%; right: 5%; height: 2px; background: red; z-index: 10; }
  .tip { color: #fff; padding: 10px; font-size: 14px; }
  button { width: 100%; max-width: 500px; padding: 15px; margin: 10px auto; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; display: block; }
  .btn-scan { background: #007aff; color: #fff; }
  .btn-export { background: #34c759; color: #fff; }
  #msg { margin: 10px; font-size: 16px; }
  .success { color: green; }
  .error { color: red; }
  #records { text-align: left; max-width: 500px; margin: 20px auto; background: #fff; padding: 10px; border-radius: 8px; }
  .item { border-bottom: 1px solid #eee; padding: 8px 0; word-break: break-all; }
</style>
</head>
<body>
<h1>条形码扫码器</h1>
<div id="videoWrap">
  <video id="video" playsinline></video>
  <div class="red-line"></div>
  <div class="tip">请让条形码横向对准红线</div>
</div>
<button class="btn-scan" id="btnScan">▶ 开启 / 停止扫描</button>
<button class="btn-export" id="btnExport">📊 随时导出表格(Excel可用)</button>
<div id="msg">等待操作...</div>
<div id="records"><b>扫码记录 (0)：</b></div>

<script>
let isScanning = false, stream, codeReader, records = [];
try { codeReader = new ZXing.BrowserMultiFormatReader(); } catch(e) {}

const video = document.getElementById('video'), msg = document.getElementById('msg'), recordsDiv = document.getElementById('records');

document.getElementById('btnScan').onclick = async () => {
  if (isScanning) { stopScan(); return; }
  try {
    msg.innerHTML = "请求相机权限中...";
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", focusMode: "continuous" }, audio: false });
    video.srcObject = stream;
    video.play();
    isScanning = true;
    msg.innerHTML = "扫描中...请横向对准条码";
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    codeReader.decodeFromVideoDevice(null, video, (result, err) => {
      if (result) {
        const text = result.text, format = result.format || "条形码";
        if (records.length === 0 || records[records.length-1].content !== text) {
          records.push({ idx: records.length+1, time: new Date().toLocaleString(), content: text, type: format });
          updateRecords();
          msg.innerHTML = `<span class="success">识别: ${text}</span>`;
          if(navigator.vibrate) navigator.vibrate(50);
        }
      }
    });
  } catch (e) {
    msg.innerHTML = `<span class="error">相机开启失败：${e.message}。请检查权限并用Safari/Chrome</span>`;
    isScanning = false;
  }
};

function stopScan() {
  isScanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if(codeReader) codeReader.reset();
  video.srcObject = null;
  msg.innerHTML = "已停止扫描";
}

function updateRecords() {
  recordsDiv.innerHTML = `<b>扫码记录 (${records.length})：</b>` + records.map(r => 
    `<div class="item">[${r.idx}] ${r.time}<br><b>${r.content}</b> (${r.type})</div>`
  ).join('');
}

// 导出CSV（用Excel/WPS打开即为标准表格，随时可点）
document.getElementById('btnExport').onclick = () => {
  let csv = '\uFEFF序号,时间,内容,类型\n';
  if (records.length > 0) {
    csv += records.map(r => `${r.idx},"${r.time}","${r.content.replace(/"/g,'""')}",${r.type}`).join("\n");
  }
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `扫码表格_${records.length}条_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  msg.innerHTML = records.length === 0 ? "无记录，已导出空表格(表头)" : `已导出${records.length}条(Excel可打开)`;
};
</script>
</body>
</html>
