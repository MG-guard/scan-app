<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>条码扫码</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#121212;color:#eee;margin:0;padding:10px}
.card{max-width:520px;margin:0 auto;background:#1f1f1f;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h2{margin:0 0 6px;text-align:center;font-size:20px}
.sub{text-align:center;color:#aaa;font-size:12px;margin-bottom:10px}
#wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
#reticle{position:absolute;left:6%;right:6%;top:42%;height:16%;border:2px solid #2ecc71;border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
#line{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#e74c3c;pointer-events:none;box-shadow:0 0 8px red}
.btn{width:100%;padding:12px;border-radius:10px;border:0;font-size:16px;margin:6px 0;color:#fff}
.blue{background:#1976d2}.green{background:#2e7d32}.red{background:#c62828}.gray{background:#555}.orange{background:#e67e22}
.log{margin-top:10px;padding:10px;border-radius:10px;background:#2a2a2a;font-size:14px;min-height:22px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:6px;border-bottom:1px solid #333;text-align:left}
th{color:#90caf9}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:12px;background:#444}
.ok{color:#66bb6a}.err{color:#ef5350}.warn{color:#ffa726}
.tip{color:#aaa;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <h2>条码扫码</h2>
  <div class="sub">只识别 Code128 · 11位数字 · 扫到自动停</div>

  <div id="wrap">
    <video id="v" autoplay playsinline muted></video>
    <div id="reticle"></div>
    <div id="line"></div>
  </div>

  <button id="go" class="btn blue">▶ 开始扫描</button>
  <button id="shot" class="btn orange">📷 拍照识别</button>
  <button id="paste" class="btn gray">📋 读取剪贴板</button>
  <button id="exp" class="btn green">📊 导出 Excel</button>
  <button id="clr" class="btn red">🗑 清空</button>

  <div class="log" id="log">引擎加载中...</div>
  <div class="tip">记录只存在本机浏览器</div>
  <div id="box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const Z=window.ZXing;
const v=document.getElementById('v');
const log=document.getElementById('log');
const box=document.getElementById('box');

let scanning=false, stream=null, reader=null;
let recs=JSON.parse(localStorage.getItem('scanRecsV4')||'[]');
let next=recs.length?Math.max(...recs.map(r=>r.idx))+1:1;
let lastDecode=0; // 节流用

function l(msg,cls=''){log.innerHTML=`<span class="${cls}">${msg}</span>`}
function save(){localStorage.setItem('scanRecsV4',JSON.stringify(recs))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function render(){
  if(!recs.length){box.innerHTML='<div class="tip">记录(0)</div>';return}
  box.innerHTML='<table><tr><th>#</th><th>时间</th><th>内容</th><th>来源</th></tr>'+
    recs.slice().reverse().map(r=>`<tr><td>${r.idx}</td><td>${esc(r.time)}</td><td>${esc(r.content)}</td><td><span class="tag">${esc(r.type)}</span></td></tr>`).join('')+'</table>';
}
render();

function okCode(c){return /^\d{10,12}$/.test((c||'').trim())}

function add(code,type){
  code=(code||'').trim();
  if(!okCode(code)){l('❌ 不是10-12位数字：'+code,'err');return false;}
  recs.push({idx:next++,time:new Date().toLocaleString(),content:code,type});
  save(); render(); l('✅ 已保存：'+code,'ok');
  if(navigator.vibrate) navigator.vibrate([100,40,100]);
  return true;
}

function stop(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  if(reader){try{reader.reset()}catch(e){} reader=null;}
  v.srcObject=null;
  document.getElementById('go').textContent='▶ 开始扫描';
}

async function start(){
  if(scanning){stop(); return;}
  l('启动相机...');
  document.getElementById('go').textContent='⏹ 停止';
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280,max:1280},
        height:{ideal:720,max:720}
      },
      audio:false
    });
    v.srcObject=stream;
    await new Promise((res,rej)=>{
      v.onloadedmetadata=()=>v.play().then(res).catch(rej);
      setTimeout(()=>rej(new Error('超时')),6000);
    });

    scanning=true; l('扫描中...');

    // 关键：只开 Code128，不试其他
    const hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128]);

    reader=new Z.BrowserMultiFormatReader(hints);

    // 节流：每300ms才解一帧
    reader.decodeFromVideoDevice(null,v,(r,err)=>{
      const now=Date.now();
      if(now-lastDecode<300) return; // 跳过
      if(r){
        lastDecode=now;
        if(okCode(r.getText())){
          if(add(r.getText(),r.getBarcodeFormat?.()||'Code128')) stop();
        }
      }
    });
  }catch(e){
    l('❌ 相机失败：'+e.message,'err');
    document.getElementById('go').textContent='▶ 开始扫描';
  }
}
document.getElementById('go').onclick=start;

// 拍照识别
document.getElementById('shot').onclick=async()=>{
  if(!stream){l('请先点开始扫描','warn');return;}
  const canvas=document.createElement('canvas');
  canvas.width=v.videoWidth||1280;
  canvas.height=v.videoHeight||720;
  canvas.getContext('2d').drawImage(v,0,0);
  try{
    const hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_128]);
    const rr=new Z.BrowserMultiFormatReader(hints);
    const res=await rr.decodeFromCanvas(canvas);
    if(res && okCode(res.getText())){
      add(res.getText(),'拍照识别');
    }else l('❌ 没识别到','err');
  }catch(e){l('❌ 识别失败','err');}
};

// 剪贴板
document.getElementById('paste').onclick=async()=>{
  try{
    const t=await navigator.clipboard.readText();
    const m=t.match(/\d{10,12}/g);
    if(m){let s=0;for(const c of m) if(add(c,'剪贴板')) s++; if(!s) l('没有效数字','warn')}
    else l('剪贴板没有条码数字','warn');
  }catch(e){l('读取失败：'+e.message,'err');}
};

// 导出
document.getElementById('exp').onclick=()=>{
  if(!recs.length){l('没有记录');return;}
  const ws=XLSX.utils.aoa_to_sheet([['序号','时间','内容','来源'],...recs.map(r=>[r.idx,r.time,r.content,r.type])]);
  ws['!cols']=[{wch:6},{wch:20},{wch:16},{wch:12}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'记录');
  XLSX.writeFile(wb,`扫码_${recs.length}条_${new Date().toISOString().slice(0,10)}.xlsx`);
  l('已导出 Excel','ok');
};

document.getElementById('clr').onclick=()=>{
  if(recs.length && confirm('清空？')){recs=[];next=1;save();render();l('已清空')}
};
</script>
</body>
</html>
