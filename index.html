<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>条形码扫码与导出</title>
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
.container { max-width: 500px; margin: auto; text-align: center; }
h2 { margin: 5px 0 10px; }
#cameraBox { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; }
#interactive { width: 100%; height: 100%; }
#interactive video, #interactive canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
#interactive canvas.drawingBuffer { position: absolute; top: 0; left: 0; }
.scan-region { position: absolute; top: 45%; left: 8%; right: 8%; height: 2px; background: red; z-index: 20; }
.tip { color: #666; font-size: 12px; margin: 6px 0; }
button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; color: #fff; }
.btn-scan { background: #007aff; }
.btn-export { background: #34c759; }
#msg { margin: 8px 0; font-size: 14px; }
.success { color: green; font-weight: bold; }
.error { color: red; }
#records { background: #fff; padding: 10px; margin-top: 10px; border-radius: 8px; text-align: left; max-height: 220px; overflow-y: auto; font-size: 13px; }
.item { border-bottom: 1px solid #eee; padding: 6px 0; word-break: break-all; }
</style>
</head>
<body>
<div class="container">
  <h2>条形码扫码器</h2>
  <div id="cameraBox">
    <div id="interactive"></div>
    <div class="scan-region"></div>
  </div>
  <div class="tip">条码横向放平，让红线条穿过条码黑色竖线</div>
  <button class="btn-scan" id="btnScan">▶ 开启 / 停止扫描</button>
  <button class="btn-export" id="btnExport">📊 随时导出 Excel (.xlsx)</button>
  <div id="msg">等待操作...</div>
  <div id="records"><b>扫码记录 (0)：</b></div>
</div>

<script>
let scanning = false;
const records = [];
const msg = document.getElementById('msg');
const recordsDiv = document.getElementById('records');
let lastCode = '', lastTime = 0;

function updateRecords() {
  recordsDiv.innerHTML = `<b>扫码记录 (${records.length})：</b>` + records.map(r =>
    `<div class="item">[${r.idx}] ${r.time}<br><b>${r.content}</b> (${r.type})</div>`
  ).join('');
}

function startScan() {
  msg.textContent = '启动中...';
  Quagga.init({
    inputStream: { type: 'LiveStream', target: document.querySelector('#interactive'), constraints: { facingMode: 'environment' } },
    locator: { patchSize: 'medium', halfSample: true },
    numOfWorkers: 2,
    decoder: { readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader', 'upc_reader', 'upc_e_reader', 'i2of5_reader'] },
    locate: true
  }, function(err) {
    if (err) { msg.innerHTML = '<span class="error">启动失败：' + err + '</span>'; return; }
    scanning = true;
    msg.textContent = '扫描中...';
    Quagga.start();
  });

  Quagga.onDetected(function(result) {
    const code = result.codeResult.code;
    const now = Date.now();
    // 防抖：同一码 1.5 秒内不重复
    if (code === lastCode && now - lastTime < 1500) return;
    lastCode = code; lastTime = now;
    const format = result.codeResult.format || '条形码';
    records.push({ idx: records.length + 1, time: new Date().toLocaleString(), content: code, type: format });
    updateRecords();
    msg.innerHTML = '<span class="success">识别：' + code + '</span>';
    if (navigator.vibrate) navigator.vibrate(50);
  });
}

function stopScan() {
  if (scanning) { Quagga.stop(); scanning = false; }
  msg.textContent = '已停止';
}

document.getElementById('btnScan').onclick = () => scanning ? stopScan() : startScan();

// 导出真正的 Excel (.xlsx)，随时可点
document.getElementById('btnExport').onclick = () => {
  const wsData = [['序号', '扫描时间', '扫描内容', '码类型']];
  records.forEach(r => wsData.push([r.idx, r.time, r.content, r.type]));
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{ wch: 6 }, { wch: 20 }, { wch: 30 }, { wch: 12 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '扫码记录');
  XLSX.writeFile(wb, `扫码记录_${records.length}条_${new Date().toISOString().slice(0,10)}.xlsx`);
  msg.textContent = records.length ? '已导出 ' + records.length + ' 条到 Excel' : '无记录，已导出空表格';
};
</script>
</body>
</html>
