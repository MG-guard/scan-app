<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>条形码扫码与导出</title>
<!-- 引入支持条形码的 ZXing 库 -->
<script src="https://unpkg.com/@zxing/library@0.19.2/umd/index.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
  .container { max-width: 600px; margin: 0 auto; text-align: center; }
  #cameraBox { width: 100%; height: 300px; background: #000; margin: 10px 0; position: relative; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .line { position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: red; animation: scan 2s infinite; }
  @keyframes scan { 0% {top:20%} 50% {top:80%} 100% {top:20%} }
  button { padding: 12px 20px; margin: 5px; border: none; border-radius: 5px; background: #007bff; color: #fff; font-size: 16px; cursor: pointer; }
  button:active { background: #0056b3; }
  .btn-export { background: #28a745; }
  .record-box { background: #fff; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: left; max-height: 300px; overflow-y: auto; }
  .item { border-bottom: 1px solid #eee; padding: 8px 0; font-size: 14px; }
  .success { color: green; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h2>条形码扫码器</h2>
  <div id="cameraBox">
    <video id="video" playsinline></video>
    <div class="line"></div>
  </div>
  <button id="btnScan">▶ 开启/扫描</button>
  <button id="btnExport" class="btn-export">📊 导出CSV</button>
  <div id="msg"></div>
  <div class="record-box" id="records"><b>扫码记录：</b></div>
</div>

<script>
let codeReader = new ZXing.BrowserMultiFormatReader();
let isScanning = false;
let stream = null;
const records = [];
const video = document.getElementById('video');
const msg = document.getElementById('msg');
const recordsDiv = document.getElementById('records');

document.getElementById('btnScan').onclick = async () => {
  if (isScanning) return stopScan();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    video.play();
    isScanning = true;
    msg.innerHTML = "扫描中...请将条形码对准红线";
    codeReader.decodeFromVideoDevice(null, video, (result, err) => {
      if (result) {
        const text = result.text;
        const format = result.format || "条形码";
        // 防抖：避免同一码连续记录
        if (records.length === 0 || records[records.length-1].content !== text) {
          const time = new Date().toLocaleString();
          records.push({ idx: records.length+1, time, content: text, type: format });
          updateRecords();
          msg.innerHTML = `<span class="success">识别成功: ${text}</span>`;
          // 震动反馈（手机支持则触发）
          if(navigator.vibrate) navigator.vibrate(50);
        }
      }
    });
  } catch (e) {
    msg.innerHTML = "相机开启失败，请检查权限";
  }
};

function stopScan() {
  isScanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  codeReader.reset();
  msg.innerHTML = "已停止";
}

function updateRecords() {
  recordsDiv.innerHTML = "<b>扫码记录：</b>" + records.map(r => 
    `<div class="item">[${r.idx}] ${r.time}<br>内容: <b>${r.content}</b> (${r.type})</div>`
  ).join('');
}

document.getElementById('btnExport').onclick = () => {
  if (records.length === 0) return alert("无数据");
  const BOM = '\uFEFF';
  const csv = BOM + "序号,时间,内容,类型\n" + records.map(r => 
    `${r.idx},"${r.time}","${r.content.replace(/"/g,'""')}",${r.type}`
  ).join("\n");
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `扫码记录_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
};
</script>
</body>
</html>
